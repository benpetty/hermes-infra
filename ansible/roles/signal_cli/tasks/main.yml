---
# Install signal-cli. The `-Linux-client` build is a single binary that
# delegates to the system JRE (installed by the common role). We don't
# attempt linking here — that's a runtime, manual step (QR scan from the
# user's phone).

- name: Download and unpack signal-cli {{ signal_cli_version }}
  ansible.builtin.unarchive:
    src: "https://github.com/AsamK/signal-cli/releases/download/v{{ signal_cli_version }}/signal-cli-{{ signal_cli_version }}-Linux-client.tar.gz"
    dest: /opt/
    remote_src: true
    creates: /opt/signal-cli-client

- name: Symlink signal-cli into PATH
  ansible.builtin.file:
    src: /opt/signal-cli-client
    dest: /usr/local/bin/signal-cli
    state: link
    force: true

- name: Verify signal-cli runs
  ansible.builtin.command:
    cmd: signal-cli --version
  register: signal_cli_version_check
  changed_when: false
